name: V13 NLLB-200 3.3B Isolated Test

on:
  workflow_dispatch:

jobs:
  nllb-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "transformers<5" sentencepiece ctranslate2
      - name: Download NLLB-200 3.3B INT8 test model
        run: |
          python -m pip install -U huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="mijuanlo/nllb-200-3.3B-ct2-int8",
              local_dir="nllb-200-3.3B-ct2-int8",
          )
          PY
      - name: Run isolated translation benchmark
        env:
          NLLB_MODEL_DIR: ${{ github.workspace }}/nllb-200-3.3B-ct2-int8
        run: python tests/nllb_200_3_3b_test.py
