name: NabzKhabar Publication Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nabzkhabar-publication-watchdog
  cancel-in-progress: true

jobs:
  publication-health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check fresh publication telemetry
        run: python scripts/check_publication_health.py

      - name: Open or update incident alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "ALERT: NabzKhabar publication stopped or telemetry is stale";

            const body = [
              "The publication watchdog detected stale or failed runtime evidence.",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Checked commit: ${context.sha}`,
              "",
              "Inspect v13_monitor.json, v13_health.json, and feed_status/feed_summary."
            ].join("
");

            const open = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                labels: "publication-outage",
                per_page: 100
              }
            );

            const existing = open.find(
              issue => issue.title === title
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["publication-outage"]
              });
            }
