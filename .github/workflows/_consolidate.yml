name: NabzKhabar Consolidation

on:
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabzkhabar-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Consolidate v12-v14 into main.py
        run: |
          set -e
          python - <<'PY'
          import ast
          import v12_runner
          import v13_runner
          import v14_runner

          source_path = 'main.py'
          with open(source_path, 'r', encoding='utf-8') as f:
              original = f.read()

          source = v13_runner.cleanup_duplicate_definitions(original)
          source = v13_runner.collapse_repeated_canonical_history_blocks(source)
          source = v12_runner.patch_canonical_duplicate_guard(source)
          source = v12_runner.patch_source_coverage(source)
          source = v12_runner.patch_hot_news(source)
          source = v13_runner.cleanup_duplicate_definitions(source)
          source = v13_runner.collapse_repeated_canonical_history_blocks(source)
          source = v13_runner.patch_quality_gate(source)
          source = v13_runner.patch_event_level_dedup(source)
          source = v13_runner.cleanup_duplicate_definitions(source)
          source = v13_runner.collapse_repeated_canonical_history_blocks(source)
          source = v14_runner.patch_event_dedup(source)
          source = v13_runner.cleanup_duplicate_definitions(source)
          source = v13_runner.collapse_repeated_canonical_history_blocks(source)

          ast.parse(source)

          with open(source_path, 'w', encoding='utf-8') as f:
              f.write(source)

          print('Consolidated main.py successfully; runtime was not executed.')
          PY

      - name: Switch news workflow to main.py
        run: |
          set -e
          sed -i 's/python v14_runner.py/python main.py/g' .github/workflows/bot.yml

      - name: Validate main.py
        run: |
          python -m py_compile main.py
          grep -q 'python main.py' .github/workflows/bot.yml
          ! grep -q 'v14_runner.py' .github/workflows/bot.yml

      - name: Remove legacy runners and this migration workflow
        run: |
          rm -f v12_runner.py v13_runner.py v14_runner.py .github/workflows/_consolidate.yml

      - name: Commit consolidated architecture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add main.py .github/workflows/bot.yml v12_runner.py v13_runner.py v14_runner.py .github/workflows/_consolidate.yml
          if git diff --cached --quiet; then
            echo 'No consolidation changes found.'
            exit 0
          fi
          git commit -m 'Consolidate NabzKhabar runtime into main.py [skip ci]'
          git push origin HEAD:main
