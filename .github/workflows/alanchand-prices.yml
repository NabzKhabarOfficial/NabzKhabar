name: AlanChand Prices

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: alanchand-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ALANCHAND_API_TOKEN: ${{ secrets.ALANCHAND_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Publish AlanChand price snapshot
        run: python alanchand_prices.py
