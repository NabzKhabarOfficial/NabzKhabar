name: V13 Argos Standalone Test

on:
  workflow_dispatch:
  push:
    paths:
      - "v13_argos_translate.py"
      - ".github/workflows/argos-standalone-test.yml"

permissions:
  contents: read

jobs:
  argos-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Argos model
        uses: actions/cache@v4
        with:
          path: .argos-packages
          key: ${{ runner.os }}-nabz-argos-en-fa-v1
          restore-keys: |
            ${{ runner.os }}-nabz-argos-en-fa-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile v13_argos_translate.py

      - name: Real Argos translation and numeric safety test
        env:
          ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.argos-packages
        run: |
          python - <<'PY'
          import v13_argos_translate as a

          print("=== V13 ARGOS STANDALONE TEST ===")
          print("1) Checking local EN->FA model...")
          if not a.healthcheck():
              raise SystemExit("FAIL: Argos EN->FA model is unavailable")
          print("PASS: Argos EN->FA model is ready")

          cases = [
              ("Major earthquake kills 25 people and injures 202 others",
               "Officials said the earthquake killed 25 people and injured 202 others on Monday."),
              ("Four hundred people were evacuated after the fire",
               "Emergency teams evacuated four hundred people from the affected area."),
              ("Two hundred and two residents were rescued",
               "Rescue teams said two hundred and two residents were safely evacuated."),
          ]

          for i, (title, body) in enumerate(cases, 1):
              print(f"2.{i}) Translating factual-number case...")
              result = a.translate_foreign_story(title, body)
              print("RESULT:", result)
              if not result:
                  raise SystemExit(f"FAIL: Argos rejected valid test case {i}")
              if a._persian_ratio(result["title"]) < 0.60:
                  raise SystemExit(f"FAIL: translated title is not sufficiently Persian in case {i}")

          print("3) Checking numeric false-positive regression...")
          ordinary = "این خبر درباره مسیر جدید و شرایط عادی شهر است."
          values = a._numeric_values(ordinary)
          print("ORDINARY PERSIAN VALUES:", values)
          if values:
              raise SystemExit("FAIL: ordinary Persian text produced false numeric values")

          print("4) Checking explicit Persian digits...")
          values = a._numeric_values("در این حادثه ۲۵ نفر زخمی شدند.")
          print("EXPLICIT DIGIT VALUES:", values)
          if 25 not in values:
              raise SystemExit("FAIL: Persian digit ۲۵ was not detected")

          print("5) Written-number compatibility check...")
          written = a._numeric_values("twenty-three people were rescued")
          print("WRITTEN NUMBER VALUES:", written)
          if written:
              raise SystemExit("FAIL: written number words must not be treated as explicit digits")

          print("=== V13 ARGOS STANDALONE TEST: PASS ===")
          PY
