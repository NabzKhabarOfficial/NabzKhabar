name: NabzKhabar Instagram Publisher

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabzkhabar-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-instagram.txt

      - name: Install Instagram dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-instagram.txt

      - name: Validate publisher
        run: python -m py_compile instagram_publisher.py

      - name: Publish to Instagram
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION_B64: ${{ secrets.IG_SESSION_B64 }}
          IG_MAX_POSTS_PER_DAY: '2'
          IG_MAX_STORY_AGE_MINUTES: '180'
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python instagram_publisher.py

      - name: Persist Instagram state
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- instagram_state.json; then
            echo "IG: no state changes"
            exit 0
          fi
          git add instagram_state.json
          git commit -m "chore(instagram): persist publication state"
          git pull --rebase origin main
          git push
