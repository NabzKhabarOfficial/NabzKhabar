name: NabzKhabar Dedup Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch event-level duplicate guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")
          text = path.read_text(encoding="utf-8")

          old_process = '''    if history_contains_story(\n        original_title,\n        title_history\n    ):\n\n        print(\n            "SKIPPED: semantic history"\n        )\n\n        return False\n'''

          new_process = '''    if history_contains_story(\n        original_title,\n        title_history\n    ):\n\n        print(\n            "SKIPPED: semantic history"\n        )\n\n        return False\n\n    # Event-level history guard. This is intentionally separate from\n    # title similarity so the same real-world event is blocked even when\n    # publishers or Gemini rewrite the headline differently.\n    if event_history_contains(candidate, title_history):\n\n        print(\n            "SKIPPED: event history (same real-world event)"\n        )\n\n        return False\n'''

          if old_process not in text:
              raise SystemExit("process_news semantic-history block not found")
          text = text.replace(old_process, new_process, 1)

          old_main = '''            if history_contains_story(\n                title,\n                title_history\n            ):\n                continue\n\n            # Effective score.\n'''

          new_main = '''            if history_contains_story(\n                title,\n                title_history\n            ):\n                continue\n\n            # Event-level history guard prevents the same real-world event\n            # from being selected again under a different headline.\n            if event_history_contains(candidate, title_history):\n                continue\n\n            # Effective score.\n'''

          if old_main not in text:
              raise SystemExit("main selection history block not found")
          text = text.replace(old_main, new_main, 1)

          path.write_text(text, encoding="utf-8")
          print("Dedup patch applied")
          PY

      - name: Validate
        run: python -m py_compile main.py

      - name: Commit and remove temporary workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -f .github/workflows/_dedup_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/_dedup_fix.yml
          git commit -m "Fix event-level duplicate blocking [skip ci]"
          git push origin HEAD:main
