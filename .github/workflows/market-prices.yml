name: Market Prices

on:
  schedule:
    # Every 4 hours. The free source remains well within its daily request limit.
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: market-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Publish market price snapshot
        run: python market_prices.py
