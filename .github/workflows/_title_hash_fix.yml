name: NabzKhabar Title Hash Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exact-title history guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("main.py")
          text = path.read_text(encoding="utf-8")

          old = '''def make_legacy_history_key(title, link):\n    """Old v11/v12 title+URL hash kept for backward compatibility."""\n    canonical_link = canonicalize_url(link)\n    value = normalize_space(title) + "|" + canonical_link\n    return hashlib.sha256(\n        value.encode("utf-8")\n    ).hexdigest()\n\n\ndef history_key_exists(title, link, hash_history):\n'''

          new = '''def make_legacy_history_key(title, link):\n    """Old v11/v12 title+URL hash kept for backward compatibility."""\n    canonical_link = canonicalize_url(link)\n    value = normalize_space(title) + "|" + canonical_link\n    return hashlib.sha256(\n        value.encode("utf-8")\n    ).hexdigest()\n\n\ndef make_title_history_key(title):\n    """Stable exact-title identity, independent of the source URL."""\n    normalized = normalize_space(normalize_digits(title or ""))\n    normalized = normalized.replace("ي", "ی").replace("ى", "ی").replace("ك", "ک")\n    normalized = normalized.lower()\n    value = "TITLE_EXACT|" + normalized\n    return hashlib.sha256(value.encode("utf-8")).hexdigest()\n\n\ndef history_key_exists(title, link, hash_history):\n'''

          if old not in text:
              raise SystemExit("legacy history block not found")
          text = text.replace(old, new, 1)

          old2 = '''    legacy = make_legacy_history_key(title, link)\n    return legacy in hash_history\n'''

          new2 = '''    legacy = make_legacy_history_key(title, link)\n    if legacy in hash_history:\n        return True\n\n    # Exact title identity blocks the same published headline even when\n    # the publisher/Google News supplies a different URL.\n    title_key = make_title_history_key(title)\n    return title_key in hash_history\n'''

          if old2 not in text:
              raise SystemExit("history key return block not found")
          text = text.replace(old2, new2, 1)

          old3 = '''                hash_history.add(\n                    history_key\n                )\n\n                if canonical_article_url:\n'''
          new3 = '''                hash_history.add(\n                    history_key\n                )\n                hash_history.add(\n                    make_title_history_key(original_title)\n                )\n                hash_history.add(\n                    make_title_history_key(final_title)\n                )\n\n                if canonical_article_url:\n'''
          if old3 not in text:
              raise SystemExit("video history block not found")
          text = text.replace(old3, new3, 1)

          old4 = '''                    hash_history.add(\n                        history_key\n                    )\n\n                    record_semantic_history(\n'''
          new4 = '''                    hash_history.add(\n                        history_key\n                    )\n                    hash_history.add(\n                        make_title_history_key(original_title)\n                    )\n                    hash_history.add(\n                        make_title_history_key(final_title)\n                    )\n\n                    record_semantic_history(\n'''
          count4 = text.count(old4)
          if count4 < 1:
              raise SystemExit("photo history block not found")
          text = text.replace(old4, new4, 1)

          old5 = '''        hash_history.add(\n            history_key\n        )\n\n        record_semantic_history(\n'''
          new5 = '''        hash_history.add(\n            history_key\n        )\n        hash_history.add(\n            make_title_history_key(original_title)\n        )\n        hash_history.add(\n            make_title_history_key(final_title)\n        )\n\n        record_semantic_history(\n'''
          if old5 not in text:
              raise SystemExit("text history block not found")
          text = text.replace(old5, new5, 1)

          path.write_text(text, encoding="utf-8")
          print("Exact-title duplicate guard applied")
          PY

      - name: Validate
        run: python -m py_compile main.py

      - name: Commit and remove temporary workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -f .github/workflows/_title_hash_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py .github/workflows/_title_hash_fix.yml
          git commit -m "Strengthen exact-title duplicate protection [skip ci]"
          git push origin HEAD:main
