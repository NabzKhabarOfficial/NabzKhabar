name: NabzKhabar Offline Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabzkhabar-offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Telegram offline regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BOT_TOKEN: OFFLINE_TEST_TOKEN
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile all runtime Python files
        run: |
          python -m compileall -q . \
            -x '(^|/)(tests|\.git|__pycache__)(/|$)'

      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "v13_standalone",
              "v13_media_branding",
              "v13_ai_router",
              "v13_content_enhancer",
              "v13_ad_filter",
              "v13_intelligence",
              "v13_quality_gate",
              "v13_freshness_rescue",
              "v13_critical_rescue",
              "v13_global_rescue",
              "v13_policy_guard",
              "v13_editorial_formatter",
              "v13_byline_cleaner",
              "v13_final_guard",
              "v13_monitor",
              "v13_editor_gate",
              "v13_story_dedup",
              "v13_incident_dedup",
              "v13_event_judge",
              "v13_importance_rescue",
              "v13_text_polish",
              "v13_post_design",
              "v13_ai_extra",
              "v13_ai_pace",
              "v13_guard_repair",
              "v13_mistral",
              "run_bot",
              "education",
              "car_prices",
              "market_prices",
              "weather",
              "daily_boards",
              "daily_cards",
              "daily_sports",
              "sports_results",
          ]

          for module_name in modules:
              importlib.import_module(module_name)

          print("NabzKhabar import smoke test: PASS")
          PY

      - name: Run offline regression tests
        run: |
          python -m pytest -q tests
