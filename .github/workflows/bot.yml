name: NabzKhabar News Bot

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabzkhabar-bot
  queue: max
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Verify media tools
        run: |
          set -e
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate independent V13 syntax
        run: |
          python -m py_compile *.py tests/*.py
      - name: Run V13 regression suite
        run: |
          python - <<'PY'
          import v13_intelligence as intelligence
          import v13_global_rescue as global_rescue
          import v13_quality_gate as quality

          class Dummy: pass
          v = Dummy()
          geopolitical_cases = [
              "حمله موشکی به یک پایگاه نظامی در منطقه",
              "زلزله شدید دهها کشته بر جای گذاشت",
              "درگیری نظامی در مرز اوکراین و روسیه",
              "Mass shooting leaves 27 dead",
              "Major explosion kills 30 people",
          ]
          for title in geopolitical_cases:
              candidate = {"title": title, "summary": "", "description": "", "link": "https://example.com/news"}
              ok, score, reason = intelligence.is_publishable(v, candidate)
              if not ok or "rescue" not in reason and "override" not in reason and score < intelligence.MIN_EVENT_SCORE:
                  raise SystemExit(f"V13 CRITICAL RESCUE TEST FAILED: {title} -> {ok}, {score}, {reason}")
          print("V13 REGRESSION: PASS")
          PY
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: python run_bot.py
      - name: Commit runtime state
        run: |
          git config user.name 'Nabz V13 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sent_news.txt v13_health.json v13_monitor.json v13_rejected_news.json ai_model_health.json instagram_state.json
          git diff --cached --quiet || git commit -m 'chore: update V13 runtime state'
          git push
