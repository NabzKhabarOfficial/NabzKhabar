name: NabzKhabar News Bot

on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabzkhabar-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Ensure media tools
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "ffmpeg already available on the runner."
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version
          ffmpeg -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate independent V13 syntax
        run: |
          python -m py_compile v13_standalone.py v13_media_branding.py v13_ai_router.py v13_topic_diversity.py football_schedule.py run_bot.py education.py

      - name: Run independent V13 engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MAX_NEWS_PER_RUN: '4'
        run: python run_bot.py

      - name: Persist sent-news history safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          cp sent_news.txt /tmp/local_sent_news.txt 2>/dev/null || true
          cp ai_model_health.json /tmp/local_ai_model_health.json 2>/dev/null || true
          cp football_schedule_history.json /tmp/local_football_schedule_history.json 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin main

            if git show origin/main:sent_news.txt > /tmp/remote_sent_news.txt 2>/dev/null; then
              cat /tmp/remote_sent_news.txt /tmp/local_sent_news.txt 2>/dev/null |
                awk 'NF && !seen[$0]++' > /tmp/merged_all_history.txt
            else
              cat /tmp/local_sent_news.txt 2>/dev/null |
                awk 'NF && !seen[$0]++' > /tmp/merged_all_history.txt || true
            fi

            awk '/^TITLE\|/ { print > "/tmp/history_titles.txt"; next } { print > "/tmp/history_hashes.txt" }' /tmp/merged_all_history.txt
            tail -n 50000 /tmp/history_hashes.txt > /tmp/history_hashes_bounded.txt 2>/dev/null || true
            cat /tmp/history_hashes_bounded.txt /tmp/history_titles.txt 2>/dev/null > /tmp/merged_sent_news.txt || true

            git reset --hard origin/main
            cp /tmp/merged_sent_news.txt sent_news.txt 2>/dev/null || true
            if [ -f /tmp/local_ai_model_health.json ]; then
              cp /tmp/local_ai_model_health.json ai_model_health.json
            fi
            if [ -f /tmp/local_football_schedule_history.json ]; then
              cp /tmp/local_football_schedule_history.json football_schedule_history.json
            fi

            git add sent_news.txt
            if [ -f ai_model_health.json ]; then git add ai_model_health.json; fi
            if [ -f football_schedule_history.json ]; then git add football_schedule_history.json; fi
            if git diff --cached --quiet; then
              echo "No history changes."
              exit 0
            fi

            git commit -m "Update news history [skip ci]"

            if git push origin HEAD:main; then
              echo "History synchronized."
              exit 0
            fi

            git reset --hard HEAD~1
          done

          echo "Could not synchronize history after 3 attempts."
          exit 1
