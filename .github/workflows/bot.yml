name: NabzKhabar News Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bot.yml'

permissions:
  contents: write

concurrency:
  group: nabzkhabar-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version
          ffmpeg -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate independent V13 syntax
        run: |
          python -m py_compile v13_standalone.py v13_media_branding.py v13_ai_router.py run_bot.py education.py car_prices.py weather.py

      - name: Run AI provider connectivity test (one-time)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'AI PROVIDER TEST') }}
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          def call(name, url, headers, payload=None):
              try:
                  req = urllib.request.Request(url, headers=headers, method='POST' if payload is not None else 'GET')
                  if payload is not None:
                      req.data = json.dumps(payload).encode()
                  with urllib.request.urlopen(req, timeout=30) as r:
                      json.loads(r.read().decode())
                  print(f"AI PROVIDER TEST: PASS {name}")
                  return True
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors='replace')[:300]
                  print(f"AI PROVIDER TEST: FAIL {name} HTTP {e.code}: {body}")
                  return False
              except Exception as e:
                  print(f"AI PROVIDER TEST: FAIL {name}: {type(e).__name__}: {e}")
                  return False

          results = []
          gemini_key = os.getenv('AI_API_KEY','').strip()
          if gemini_key:
              for model in ('gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-2.5-flash'):
                  results.append(call(f'Gemini/{model}', f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={gemini_key}', {'Content-Type':'application/json'}, {'contents':[{'parts':[{'text':'پاسخ فقط JSON: {"ok":true}'}]}], 'generationConfig':{'responseMimeType':'application/json','maxOutputTokens':20}}))
          else:
              print('AI PROVIDER TEST: FAIL Gemini/no API key')
              results.append(False)

          for model in ('openai/gpt-oss-20b','openai/gpt-oss-120b'):
              key = os.getenv('GROQ_API_KEY','').strip()
              if not key:
                  print('AI PROVIDER TEST: FAIL Groq/no API key')
                  results.append(False)
                  break
              results.append(call(f'Groq/{model}', 'https://api.groq.com/openai/v1/chat/completions', {'Authorization':f'Bearer {key}','Content-Type':'application/json'}, {'model':model,'messages':[{'role':'user','content':'Return only JSON: {"ok":true}'}], 'response_format':{'type':'json_object'}, 'max_completion_tokens':20}))

          for model in ('gpt-oss-120b','zai-glm-4.7'):
              key = os.getenv('CEREBRAS_API_KEY','').strip()
              if not key:
                  print('AI PROVIDER TEST: FAIL Cerebras/no API key')
                  results.append(False)
                  break
              results.append(call(f'Cerebras/{model}', 'https://api.cerebras.ai/v1/chat/completions', {'Authorization':f'Bearer {key}','Content-Type':'application/json'}, {'model':model,'messages':[{'role':'user','content':'Return only JSON: {"ok":true}'}], 'response_format':{'type':'json_object'}, 'max_completion_tokens':20}))

          print(f"AI PROVIDER TEST SUMMARY: {sum(results)}/{len(results)} provider-model checks passed")
          PY
      - name: Run independent V13 engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: python run_bot.py

      - name: Persist sent-news history safely
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          cp sent_news.txt /tmp/local_sent_news.txt 2>/dev/null || true
          cp ai_model_health.json /tmp/local_ai_model_health.json 2>/dev/null || true
          cp car_prices_history.json /tmp/local_car_prices_history.json 2>/dev/null || true
          cp weather_history.json /tmp/local_weather_history.json 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin main

            if git show origin/main:sent_news.txt > /tmp/remote_sent_news.txt 2>/dev/null; then
              cat /tmp/remote_sent_news.txt /tmp/local_sent_news.txt 2>/dev/null |
                awk 'NF && !seen[$0]++' > /tmp/merged_sent_news.txt
            else
              cat /tmp/local_sent_news.txt 2>/dev/null |
                awk 'NF && !seen[$0]++' > /tmp/merged_sent_news.txt || true
            fi

            git reset --hard origin/main
            cp /tmp/merged_sent_news.txt sent_news.txt 2>/dev/null || true
            if [ -f /tmp/local_ai_model_health.json ]; then
              cp /tmp/local_ai_model_health.json ai_model_health.json
            fi

            if [ -f /tmp/local_car_prices_history.json ]; then
              cp /tmp/local_car_prices_history.json car_prices_history.json
            elif git show origin/main:car_prices_history.json > /tmp/remote_car_prices_history.json 2>/dev/null; then
              cp /tmp/remote_car_prices_history.json car_prices_history.json
            fi

            if [ -f /tmp/local_weather_history.json ]; then
              cp /tmp/local_weather_history.json weather_history.json
            elif git show origin/main:weather_history.json > /tmp/remote_weather_history.json 2>/dev/null; then
              cp /tmp/remote_weather_history.json weather_history.json
            fi

            git add sent_news.txt
            if [ -f ai_model_health.json ]; then git add ai_model_health.json; fi
            if [ -f car_prices_history.json ]; then git add car_prices_history.json; fi
            if [ -f weather_history.json ]; then git add weather_history.json; fi
            if git diff --cached --quiet; then
              echo "No history changes."
              exit 0
            fi

            git commit -m "Update news history [skip ci]"

            if git push origin HEAD:main; then
              echo "History synchronized."
              exit 0
            fi

            git reset --hard HEAD~1
          done

          echo "Could not synchronize history after 3 attempts."
          exit 1
