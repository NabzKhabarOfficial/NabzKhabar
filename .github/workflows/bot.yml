name: NabzKhabar News Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nabzkhabar-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Record start time
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies and media tools
        run: |
          set -e
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate V13 before execution
        run: |
          set -e
          python -m py_compile v13_standalone.py v13_media_branding.py v13_ai_router.py v13_content_enhancer.py v13_ad_filter.py v13_intelligence.py v13_quality_gate.py v13_freshness_rescue.py v13_critical_rescue.py v13_global_rescue.py v13_policy_guard.py v13_editorial_formatter.py v13_byline_cleaner.py v13_final_guard.py v13_monitor.py v13_editor_gate.py v13_story_dedup.py v13_incident_dedup.py v13_event_judge.py v13_importance_rescue.py v13_text_polish.py v13_post_design.py run_bot.py education.py car_prices.py weather.py
          for path in v13_argos_translate.py sitecustomize.py requirements-cpu.txt .github/workflows/argos-real-test.yml .github/workflows/argos-standalone-test.yml; do
            test ! -e "$path" || { echo "Obsolete path exists: $path"; exit 1; }
          done
          python - <<'PY'
          import os, importlib
          os.environ.setdefault('BOT_TOKEN','V13_IMPORT_SMOKE_TEST')
          for name in ('v13_standalone','v13_media_branding','v13_ai_router','v13_content_enhancer','v13_ad_filter','v13_intelligence','v13_quality_gate','v13_freshness_rescue','v13_critical_rescue','v13_global_rescue','v13_policy_guard','v13_editorial_formatter','v13_byline_cleaner','v13_final_guard','v13_monitor','v13_story_dedup','v13_incident_dedup','v13_event_judge','v13_importance_rescue','v13_text_polish','run_bot'):
              importlib.import_module(name)
          print('V13 PRE-RUN INTEGRITY: PASS')
          PY

      - name: Check AI pool
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          p={'Groq':'GROQ_API_KEY','Gemini':'AI_API_KEY','OpenRouter':'OPENROUTER_API_KEY'}
          print('V13 AI POOL CONFIG:', ', '.join(f'{k}={"READY" if os.getenv(v," ").strip() else "MISSING"}' for k,v in p.items()))
          PY

      - name: Reset per-run telemetry
        run: python -c "from pathlib import Path; [p.unlink() for p in (Path('v13_health.json'), Path('v13_monitor.json')) if p.exists()]" 

      - name: Run independent V13 engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python run_bot.py

      - name: Runtime monitoring
        if: ${{ always() }}
        run: python v13_monitor.py

      - name: Enforce publication health
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('v13_monitor.json')
          if not p.exists():
              print('V13 MONITOR: missing telemetry')
              sys.exit(1)
          data=json.loads(p.read_text(encoding='utf-8'))
          status=str(data.get('status','')).strip().lower()
          failed=int(data.get('failed_publications',0) or 0)
          ambiguous=int(data.get('ambiguous_publications',0) or 0)
          print(f'V13 PUBLICATION HEALTH: status={status}, failed={failed}, ambiguous={ambiguous}')
          if status == 'publication_failure' or failed > 0 or ambiguous > 0:
              sys.exit(1)
          PY

      - name: Persist runtime state without rewriting code
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          mkdir -p /tmp/v13-state
          for f in sent_news.txt ai_model_health.json v13_health.json v13_rejected_news.json v13_monitor.json car_prices_history.json weather_history.json; do
            test ! -f "$f" || cp "$f" "/tmp/v13-state/$f"
          done
          test ! -d docs || cp -r docs /tmp/v13-state/docs
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for f in sent_news.txt ai_model_health.json v13_health.json v13_rejected_news.json v13_monitor.json car_prices_history.json weather_history.json; do
              test ! -f "/tmp/v13-state/$f" || cp "/tmp/v13-state/$f" "$f"
            done
            if [ -d /tmp/v13-state/docs ]; then rm -rf docs; cp -r /tmp/v13-state/docs docs; fi
            git add sent_news.txt ai_model_health.json v13_health.json v13_rejected_news.json v13_monitor.json car_prices_history.json weather_history.json 2>/dev/null || true
            git add docs 2>/dev/null || true
            if git diff --cached --quiet; then
              echo 'No runtime-state changes.'
              exit 0
            fi
            git commit -m 'Update V13 runtime state [skip ci]'
            if git push origin HEAD:main; then
              echo 'Runtime state synchronized without rewriting code.'
              exit 0
            fi
            git reset --hard origin/main
            sleep 2
          done
          echo 'Runtime state synchronization failed.'
          exit 1

      # GitHub often delays or silently drops scheduled runs (this repo got a
      # run only every 20-35 min, and none at all for 3 hours on 3 Oct).
      # Each run therefore starts the next one itself, ~10 minutes after it
      # began. The cron above stays as a backup if this chain ever breaks.
      # During the Instagram window it also starts the Instagram publisher.
      - name: Keep the 10-minute cycle alive
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          elapsed=$(( $(date +%s) - RUN_START ))
          wait=$(( 570 - elapsed ))
          if [ "$wait" -gt 0 ]; then
            echo "Waiting ${wait}s before starting the next cycle"
            sleep "$wait"
          fi
          gh workflow run bot.yml --ref main -R "${{ github.repository }}" || echo 'Keep-alive dispatch failed; the cron backup will continue.'
          # Instagram posts only 19:30-22:30 Tehran; nudge it every cycle in that
          # window so dropped GitHub schedules cannot skip the daily post.
          hm=$(TZ=Asia/Tehran date +%H%M)
          if [ "$hm" -ge 1930 ] && [ "$hm" -le 2230 ]; then
            gh workflow run instagram.yml --ref main -R "${{ github.repository }}" || echo 'Instagram nudge failed; its own cron will continue.'
          fi
