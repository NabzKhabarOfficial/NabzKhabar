name: Run NabzKhabar Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping bot runs. A second scheduled/manual run waits for the
# first run to finish, so it always sees the latest sent_news.txt state.
concurrency:
  group: nabzkhabar-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # The bot was previously being killed at the 8-minute workflow timeout
    # while still processing candidates. Give it enough room to finish and
    # publish; this does not add any paid service or API.
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run v11 core with isolated text cleanup
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          MAX_NEWS_PER_RUN: '4'
        run: python run_bot.py

      - name: Safely update sent_news.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          cp sent_news.txt /tmp/local_sent_news.txt 2>/dev/null || :

          for attempt in 1 2 3; do
            echo "State sync attempt $attempt/3"
            git fetch origin main

            if git show origin/main:sent_news.txt > /tmp/remote_sent_news.txt 2>/dev/null; then
              cat /tmp/remote_sent_news.txt /tmp/local_sent_news.txt 2>/dev/null \
                | awk 'NF && !seen[$0]++' > /tmp/merged_sent_news.txt
            else
              cat /tmp/local_sent_news.txt 2>/dev/null \
                | awk 'NF && !seen[$0]++' > /tmp/merged_sent_news.txt || true
            fi

            git reset --hard origin/main
            if [ -f /tmp/merged_sent_news.txt ]; then
              cp /tmp/merged_sent_news.txt sent_news.txt
            fi

            git add sent_news.txt
            if git diff --cached --quiet; then
              echo "No bot state changes to commit."
              exit 0
            fi

            git commit -m "Update NabzKhabar news state [skip ci]"

            if git push origin HEAD:main; then
              echo "Bot state pushed successfully."
              exit 0
            fi

            echo "Push raced with another update; retrying..."
            git reset --hard HEAD~1
          done

          echo "ERROR: Could not safely update bot state after 3 attempts."
          exit 1
