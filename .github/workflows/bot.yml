name: Run NabzKhabar News

on:
  schedule:
    # One news workflow handles both normal and hot-news lanes.
    # Every 5 minutes; every 15-minute boundary runs the normal lane.
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabzkhabar-bot
  cancel-in-progress: false

jobs:
  run-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news lane
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          set -e
          MINUTE="$(date -u +%M)"
          MINUTE_NUM=$((10#$MINUTE))

          if (( MINUTE_NUM % 15 == 0 )); then
            echo "NORMAL NEWS LANE: max 4 posts"
            export MAX_NEWS_PER_RUN='4'
            export HOT_ONLY='0'
          else
            echo "HOT NEWS LANE: max 1 post"
            export MAX_NEWS_PER_RUN='1'
            export HOT_ONLY='1'
          fi

          python v14_runner.py

      - name: Safely update bot state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git fetch origin main
          if git show origin/main:sent_news.txt > /tmp/remote_sent_news.txt 2>/dev/null; then
            cat /tmp/remote_sent_news.txt sent_news.txt | awk 'NF && !seen[$0]++' > /tmp/merged_sent_news.txt
            mv /tmp/merged_sent_news.txt sent_news.txt
          fi
          git add sent_news.txt main.py
          if git diff --cached --quiet; then
            echo "No bot state changes to commit."
            exit 0
          fi
          git commit -m "Update NabzKhabar news state [skip ci]"
          git rebase origin/main
          git push origin HEAD:main
