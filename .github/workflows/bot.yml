name: NabzKhabar News Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabzkhabar-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies and media tools
        run: |
          set -e
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate V13 before execution
        run: |
          set -e
          python -m py_compile v13_standalone.py v13_media_branding.py v13_ai_router.py v13_content_enhancer.py v13_ad_filter.py v13_intelligence.py v13_quality_gate.py v13_freshness_rescue.py v13_critical_rescue.py v13_global_rescue.py v13_policy_guard.py v13_editorial_formatter.py v13_byline_cleaner.py v13_monitor.py run_bot.py education.py car_prices.py weather.py
          for path in v13_argos_translate.py sitecustomize.py requirements-cpu.txt .github/workflows/argos-real-test.yml .github/workflows/argos-standalone-test.yml; do
            test ! -e "$path" || { echo "Obsolete path exists: $path"; exit 1; }
          done
          python - <<'PY'
          import os, importlib
          os.environ.setdefault('BOT_TOKEN','V13_IMPORT_SMOKE_TEST')
          for name in ('v13_standalone','v13_media_branding','v13_ai_router','v13_content_enhancer','v13_ad_filter','v13_intelligence','v13_quality_gate','v13_freshness_rescue','v13_critical_rescue','v13_global_rescue','v13_policy_guard','v13_editorial_formatter','v13_byline_cleaner','v13_monitor','run_bot'):
              importlib.import_module(name)
          print('V13 PRE-RUN INTEGRITY: PASS')
          PY

      - name: Check AI pool
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          p={'Groq':'GROQ_API_KEY','Gemini':'AI_API_KEY','OpenRouter':'OPENROUTER_API_KEY'}
          print('V13 AI POOL CONFIG:', ', '.join(f'{k}={"READY" if os.getenv(v," ").strip() else "MISSING"}' for k,v in p.items()))
          PY

      - name: Run independent V13 engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python run_bot.py

      - name: Runtime monitoring
        if: ${{ always() }}
        run: python v13_monitor.py

      - name: Persist runtime state without rewriting code
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          mkdir -p /tmp/v13-state
          for f in sent_news.txt ai_model_health.json v13_health.json v13_rejected_news.json v13_monitor.json car_prices_history.json weather_history.json; do
            test ! -f "$f" || cp "$f" "/tmp/v13-state/$f"
          done

          for attempt in 1 2 3; do
            git fetch origin main
            git merge --ff-only origin/main || true
            for f in sent_news.txt ai_model_health.json v13_health.json v13_rejected_news.json v13_monitor.json car_prices_history.json weather_history.json; do
              test ! -f "/tmp/v13-state/$f" || cp "/tmp/v13-state/$f" "$f"
            done
            git add sent_news.txt ai_model_health.json v13_health.json v13_rejected_news.json v13_monitor.json car_prices_history.json weather_history.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo 'No runtime-state changes.'
              exit 0
            fi
            git commit -m 'Update V13 runtime state [skip ci]'
            if git push origin HEAD:main; then
              echo 'Runtime state synchronized without rewriting code.'
              exit 0
            fi
            git reset --soft HEAD~1
            git reset
            sleep 2
          done
          echo 'Runtime state synchronization failed.'
          exit 1
