name: NabzKhabar News Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabzkhabar-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Verify media tools
        run: |
          set -e
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate independent V13 syntax
        run: |
          python -m py_compile v13_standalone.py v13_media_branding.py v13_ai_router.py v13_content_enhancer.py v13_ad_filter.py v13_intelligence.py v13_freshness_rescue.py v13_critical_rescue.py v13_policy_guard.py v13_monitor.py run_bot.py education.py car_prices.py weather.py
      - name: V13 cleanup and runtime integrity check
        run: |
          set -e
          # These files/modules were intentionally removed from V13 and must never
          # return as hidden runtime dependencies.
          for path in v13_argos_translate.py sitecustomize.py requirements-cpu.txt .github/workflows/argos-real-test.yml .github/workflows/argos-standalone-test.yml; do
            if [ -e "$path" ]; then
              echo "V13 CLEANUP CHECK FAILED: obsolete path exists: $path"
              exit 1
            fi
          done
          if git grep -n -E 'argostranslate|v13_argos_translate|requirements-cpu|sitecustomize\.py' -- ':!*.json' ':!sent_news.txt' ':!v13_rejected_news.json' ':!v13_health.json' ':!v13_monitor.json' ':!.github/workflows/bot.yml'; then
            echo "V13 CLEANUP CHECK FAILED: stale removed-component reference found"
            exit 1
          fi
          python - <<'PY'
          import importlib
          modules = [
              "v13_standalone", "v13_media_branding", "v13_ai_router",
              "v13_content_enhancer", "v13_ad_filter", "v13_intelligence",
              "v13_freshness_rescue", "v13_critical_rescue", "v13_policy_guard",
              "v13_editorial_formatter", "v13_monitor", "run_bot",
              "education", "car_prices", "weather",
          ]
          import os
          # Import smoke-test only: the real engine requires a Telegram token at
          # startup, so use a harmless sentinel to validate module wiring without
          # contacting Telegram or publishing anything.
          os.environ.setdefault("BOT_TOKEN", "V13_IMPORT_SMOKE_TEST")
          for name in modules:
              importlib.import_module(name)
          import v13_standalone as v
          assert hasattr(v, "SkipForeignStory"), "SkipForeignStory missing"
          assert callable(v._persian_ratio), "_persian_ratio missing"
          print("V13 CLEANUP/RUNTIME INTEGRITY: PASS")
          PY
      - name: V13 final scope and freshness regression test
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ""
        run: |
          python - <<'PY'
          import v13_standalone as v
          import v13_intelligence as intelligence
          import v13_policy_guard as policy
          import v13_critical_rescue as critical
          import v13_freshness_rescue as freshness
          import v13_ai_router
          from datetime import datetime, timezone, timedelta

          # Exercise the same rescue wrapper used by production before asserting it.
          critical.install()

          telemetry = {
              "title": "OpenAI product update", "summary": "A product update was reported.",
              "description": "", "link": "https://google-analytics.com/analytics.js",
              "resolved_link": "https://google-analytics.com/analytics.js",
          }
          ok, _, reason = intelligence.is_publishable(v, telemetry)
          if ok:
              raise SystemExit("V13 TELEMETRY URL TEST FAILED: analytics endpoint was publishable")
          print("V13 TELEMETRY URL TEST: PASS", reason)
          if not v._is_telemetry_or_tracking_url("https://google-analytics.com/analytics.js"):
              raise SystemExit("V13 TELEMETRY URL HELPER TEST FAILED")
          if v._is_telemetry_or_tracking_url("https://www.bbc.com/news/world/example"):
              raise SystemExit("V13 TELEMETRY URL HELPER TEST FAILED: real article was blocked")

          rescue_cases = [
              ("Iran offers US deal to reopen Strait of Hormuz in seven days", True),
              ("Iran says it awaits US response on seven-day roadmap to end war", True),
              ("Major earthquake kills dozens and triggers mass evacuation", True),
              ("Pope Leo XIV warns AI could undermine humanity during France visit", True),
              ("Free the Strip! Melburnians fight back over a picnic spot", False),
              ("Could an iced coffee freeze you out of the job market?", False),
          ]
          for title, expected in rescue_cases:
              candidate = {"title": title, "summary": title, "description": ""}
              actual = freshness._is_critical(candidate)
              if actual != expected:
                  raise SystemExit(f"V13 FRESHNESS RESCUE TEST FAILED: {title!r} -> {actual}, expected {expected}")
          print("V13 FRESHNESS RESCUE REGRESSION: PASS")

          cases = [
              ("Watch: British pilots eject as RAF jet crashes in Wales", True),
              ("Groceries rise across Australian supermarket chains", True),
              ("نگاهی به مهمترین عناوین روزنامه های بریتانیا", True),
              ("Russia attacks Ukraine after talks with Trump", False),
              ("Iran and US officials discuss regional ceasefire", False),
              ("Major earthquake kills dozens and triggers mass evacuation", False),
              ("UN General Assembly leaders meet over the Iran conflict", False),
              ("Hurricane Polo brings fears of heavy rain and landslides in Mexico", False),
              ("Deadly attack on Indian cargo ship off coast of Oman", False),
              ("Tensions between India and Bangladesh are in focus after Dhaka skipped the BRICS summit in Delhi", False),
              ("Parents of Billy Vigar criticise the Football Association after his death as safety rules are changed for 169 clubs", False),
              ("NHS announces nationwide review of 4,500 breast cancer cases after unnecessary surgeries found", False),
              ("Police force says staff information may be compromised after cyber attack in Wales", True),
              ("Premier League club appoints new manager after poor run", True),
          ]
          for title, expected_skip in cases:
              candidate = {"title": title, "summary": "", "description": "", "link": "https://example.com/news"}
              actual = policy._foreign_local_only(candidate)
              if actual != expected_skip:
                  raise SystemExit(f"V13 FINAL SCOPE TEST FAILED: {title!r} -> {actual}, expected {expected_skip}")

          # Critical rescue must keep consequential geopolitical stories even
          # when the numeric event scorer cannot see a casualty/disaster verb.
          geopolitical_cases = [
              "Why is Canada’s PM Carney not ruling out a possible war with the US",
              "US seeking to revive Russia-Ukraine ceasefire talks",
              "Iran pitches seven-day roadmap to end conflict with US",
              "At Trump meeting, Xi Jinping lays out terms to avoid US-China military conflict",
              "Poland boosts air defence after Russian provocations amid Ukraine war",
          ]
          for title in geopolitical_cases:
              candidate = {"title": title, "summary": "", "description": "", "link": "https://example.com/news"}
              ok, score, reason = intelligence.is_publishable(v, candidate)
              if not ok or "rescue" not in reason and "override" not in reason and score < intelligence.MIN_EVENT_SCORE:
                  raise SystemExit(f"V13 CRITICAL RESCUE TEST FAILED: {title} -> {ok}, {score}, {reason}")

          # Exact production regression: the previously published Pezeshkian
          iran_source_local = {"title": "نگاهی به مهمترین عناوین روزنامه های بریتانیا", "summary": "", "description": "", "link": "https://www.yjc.ir/fa/news/example", "resolved_link": "https://www.yjc.ir/fa/news/example"}
          if not policy._foreign_local_only(iran_source_local):
              raise SystemExit("V13 FINAL SCOPE TEST FAILED: Iranian publisher bypassed foreign-local gate")
          iran_source_global = {"title": "Iran and US officials discuss regional ceasefire", "summary": "", "description": "", "link": "https://www.yjc.ir/fa/news/example", "resolved_link": "https://www.yjc.ir/fa/news/example"}
          if policy._foreign_local_only(iran_source_global):
              raise SystemExit("V13 FINAL SCOPE TEST FAILED: Iranian publisher global story was dropped")
          for title in (
              "UNGA81: Why has Africa’s Security Council reform push remained unresolved?",
              "Pope Leo XIV warns AI could undermine humanity during France visit",
          ):
              if policy._foreign_local_only({"title": title, "summary": "", "description": "", "link": "https://www.aljazeera.com/news/example"}):
                  raise SystemExit(f"V13 GLOBAL SCOPE TEST FAILED: {title}")

          if policy.NORMAL_WINDOW_MINUTES != 30 or policy.CRITICAL_RESCUE_MAX_HOURS != 6 or v.FEED_COLLECTION_WINDOW_MINUTES != 30:
              raise SystemExit("V13 FRESHNESS TEST FAILED: freshness windows changed unexpectedly")

          bad_translation = "برچسب های رهبر نپال سیل یک جنگ به جهان را ویران می کند"
          malformed_wales = "نیروی پلیس می گوید اطلاعات کارکنان را می توان پس از حمله سایبری تحق دانست."
          good_translation = "نخست وزیر نپال سیل ویرانگر را هشداری برای جهان خواند"
          if not v13_ai_router._translation_quality_bad(bad_translation) or not v13_ai_router._translation_quality_bad(malformed_wales):
              raise SystemExit("V13 TRANSLATION TEST FAILED: known malformed Persian was accepted")
          if v13_ai_router._translation_quality_bad(good_translation):
              raise SystemExit("V13 TRANSLATION TEST FAILED: valid Persian headline was rejected")

          # Regression guard: the Persian-ratio helper must actually recognize
          # Persian Unicode letters. A double-escaped regex here can silently
          # turn every valid Persian caption into a language-gate failure.
          if v._persian_ratio("زلزله شدید در ایران") < 0.90:
              raise SystemExit("V13 LANGUAGE RATIO TEST FAILED: Persian text was not recognized")
          if v._persian_ratio("Major earthquake in Iran") > 0.20:
              raise SystemExit("V13 LANGUAGE RATIO TEST FAILED: English text was over-counted")

          now = datetime.now(timezone.utc)
          if (now - (now - timedelta(minutes=20))).total_seconds() / 60 > policy.NORMAL_WINDOW_MINUTES:
              raise SystemExit("V13 FRESHNESS TEST FAILED: fresh story exceeded the normal window")
          if (now - (now - timedelta(minutes=40))).total_seconds() / 60 <= policy.NORMAL_WINDOW_MINUTES:
              raise SystemExit("V13 FRESHNESS TEST FAILED: stale story remained inside the normal window")
          print("V13 FINAL REGRESSION TEST PASSED")
          PY
      - name: Check AI Pool configuration
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          providers = {
              "Groq": bool(os.getenv("GROQ_API_KEY", "").strip()),
              "Gemini": bool(os.getenv("AI_API_KEY", "").strip()),
              "OpenRouter": bool(os.getenv("OPENROUTER_API_KEY", "").strip()),
          }
          print("V13 AI POOL CONFIG:", ", ".join(f"{k}={'READY' if v else 'MISSING'}" for k, v in providers.items()))
          print("V13 AI POOL ORDER: Groq -> Gemini -> OpenRouter")
          PY
      - name: Run independent V13 engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python run_bot.py
      - name: V13 runtime monitoring
        if: ${{ always() }}
        run: python v13_monitor.py
      - name: Persist sent-news history safely
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          cp sent_news.txt /tmp/local_sent_news.txt 2>/dev/null || true
          cp ai_model_health.json /tmp/local_ai_model_health.json 2>/dev/null || true
          cp v13_health.json /tmp/local_v13_health.json 2>/dev/null || true
          cp v13_rejected_news.json /tmp/local_v13_rejected_news.json 2>/dev/null || true
          cp v13_monitor.json /tmp/local_v13_monitor.json 2>/dev/null || true
          cp car_prices_history.json /tmp/local_car_prices_history.json 2>/dev/null || true
          cp weather_history.json /tmp/local_weather_history.json 2>/dev/null || true
          for attempt in 1 2 3; do
            git fetch origin main
            if git show origin/main:sent_news.txt > /tmp/remote_sent_news.txt 2>/dev/null; then
              cat /tmp/remote_sent_news.txt /tmp/local_sent_news.txt 2>/dev/null | awk 'NF && !seen[$0]++' > /tmp/merged_sent_news.txt
            else
              cat /tmp/local_sent_news.txt 2>/dev/null | awk 'NF && !seen[$0]++' > /tmp/merged_sent_news.txt || true
            fi
            git reset --hard origin/main
            cp /tmp/merged_sent_news.txt sent_news.txt 2>/dev/null || true
            [ ! -f /tmp/local_ai_model_health.json ] || cp /tmp/local_ai_model_health.json ai_model_health.json
            [ ! -f /tmp/local_v13_health.json ] || cp /tmp/local_v13_health.json v13_health.json
            [ ! -f /tmp/local_v13_rejected_news.json ] || cp /tmp/local_v13_rejected_news.json v13_rejected_news.json
            [ ! -f /tmp/local_v13_monitor.json ] || cp /tmp/local_v13_monitor.json v13_monitor.json
            [ ! -f /tmp/local_car_prices_history.json ] || cp /tmp/local_car_prices_history.json car_prices_history.json
            [ ! -f /tmp/local_weather_history.json ] || cp /tmp/local_weather_history.json weather_history.json
            git add sent_news.txt
            for f in ai_model_health.json v13_health.json v13_rejected_news.json v13_monitor.json car_prices_history.json weather_history.json; do [ ! -f "$f" ] || git add "$f"; done
            if git diff --cached --quiet; then echo "No history changes."; exit 0; fi
            git commit -m "Update news history [skip ci]"
            if git push origin HEAD:main; then echo "History synchronized."; exit 0; fi
            git reset --hard HEAD~1
          done
          echo "Could not synchronize history after 3 attempts."
          exit 1
