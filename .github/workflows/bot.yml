name: NabzKhabar News Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabzkhabar-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify media tools
        run: |
          set -e
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg/ffprobe missing on runner; installing only because required."
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1

      - name: Cache Argos Translate model
        uses: actions/cache@v4
        with:
          path: .argos-packages
          key: ${{ runner.os }}-nabz-argos-en-fa-v1
          restore-keys: |
            ${{ runner.os }}-nabz-argos-en-fa-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate independent V13 syntax
        run: |
          python -m py_compile v13_standalone.py v13_media_branding.py v13_ai_router.py v13_argos_translate.py v13_intelligence.py run_bot.py education.py car_prices.py weather.py

      - name: V13 scope and freshness regression test
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ""
        run: |
          python - <<'PY'
          import v13_standalone as v
          from datetime import datetime, timezone, timedelta

          cases = [
              ("Watch: Moment pilots eject as RAF jet crashes in Anglesey", True),
              ("Groceries rise across Australian supermarket chains", True),
              ("Russia attacks Ukraine after talks with Trump", False),
              ("Iran and US officials discuss regional ceasefire", False),
              ("Major earthquake kills dozens and triggers mass evacuation", False),
          ]

          for title, expected_skip in cases:
              candidate = {"title": title, "summary": "", "description": "", "link": "https://example.com/news"}
              actual = v._foreign_local_only(candidate)
              if actual != expected_skip:
                  raise SystemExit(
                      f"V13 SCOPE TEST FAILED: {title!r} -> {actual}, expected {expected_skip}"
                  )

          if v.FEED_COLLECTION_WINDOW_MINUTES != 60:
              raise SystemExit("V13 FRESHNESS TEST FAILED: feed window is not 60 minutes")
          if v.IMPORTANT_NEWS_RESCUE_MAX_AGE_MINUTES != 360:
              raise SystemExit("V13 FRESHNESS TEST FAILED: rescue window is not 360 minutes")

          fresh = datetime.now(timezone.utc) - timedelta(minutes=50)
          stale = datetime.now(timezone.utc) - timedelta(minutes=70)
          if not v.is_fresh(fresh):
              raise SystemExit("V13 FRESHNESS TEST FAILED: 50-minute story was rejected")
          if v.is_fresh(stale):
              raise SystemExit("V13 FRESHNESS TEST FAILED: 70-minute story was accepted")

          print("V13 REGRESSION TEST PASSED: foreign-local scope and freshness policy are consistent.")
          PY

      - name: Real Argos English to Persian test
        env:
          ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.argos-packages
        run: |
          set +e
          python - <<'PY'
          import v13_argos_translate as a
          result = a.translate_foreign_story(
              "Major earthquake strikes the region",
              "Officials reported that a major earthquake struck the region on Monday. Emergency teams were sent to the affected areas."
          )
          print("V13 ARGOS REAL TEST RESULT:", result)
          if not result:
              print("V13 ARGOS REAL TEST: WARNING - translation validation failed; bot will continue.")
          elif a._persian_ratio(result["title"]) < 0.60:
              print("V13 ARGOS REAL TEST: WARNING - title is not sufficiently Persian; bot will continue.")
          else:
              print("V13 ARGOS REAL TEST: PASS")
          PY
          test_code=$?
          if [ "$test_code" -ne 0 ]; then
            echo "V13 ARGOS REAL TEST: WARNING - diagnostic test exited with code $test_code; bot will continue."
          fi
          exit 0

      - name: Run independent V13 engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.argos-packages
        run: python run_bot.py

      - name: Persist sent-news history safely
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          cp sent_news.txt /tmp/local_sent_news.txt 2>/dev/null || true
          cp ai_model_health.json /tmp/local_ai_model_health.json 2>/dev/null || true
          cp v13_health.json /tmp/local_v13_health.json 2>/dev/null || true
          cp v13_rejected_news.json /tmp/local_v13_rejected_news.json 2>/dev/null || true
          cp car_prices_history.json /tmp/local_car_prices_history.json 2>/dev/null || true
          cp weather_history.json /tmp/local_weather_history.json 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin main
            if git show origin/main:sent_news.txt > /tmp/remote_sent_news.txt 2>/dev/null; then
              cat /tmp/remote_sent_news.txt /tmp/local_sent_news.txt 2>/dev/null | awk 'NF && !seen[$0]++' > /tmp/merged_sent_news.txt
            else
              cat /tmp/local_sent_news.txt 2>/dev/null | awk 'NF && !seen[$0]++' > /tmp/merged_sent_news.txt || true
            fi
            git reset --hard origin/main
            cp /tmp/merged_sent_news.txt sent_news.txt 2>/dev/null || true
            [ ! -f /tmp/local_ai_model_health.json ] || cp /tmp/local_ai_model_health.json ai_model_health.json
            [ ! -f /tmp/local_v13_health.json ] || cp /tmp/local_v13_health.json v13_health.json
            [ ! -f /tmp/local_v13_rejected_news.json ] || cp /tmp/local_v13_rejected_news.json v13_rejected_news.json
            [ ! -f /tmp/local_car_prices_history.json ] || cp /tmp/local_car_prices_history.json car_prices_history.json
            [ ! -f /tmp/local_weather_history.json ] || cp /tmp/local_weather_history.json weather_history.json
            git add sent_news.txt
            for f in ai_model_health.json v13_health.json v13_rejected_news.json car_prices_history.json weather_history.json; do
              [ ! -f "$f" ] || git add "$f"
            done
            if git diff --cached --quiet; then
              echo "No history changes."
              exit 0
            fi
            git commit -m "Update news history [skip ci]"
            if git push origin HEAD:main; then
              echo "History synchronized."
              exit 0
            fi
            git reset --hard HEAD~1
          done
          echo "Could not synchronize history after 3 attempts."
          exit 1
